name: e2e-test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  e2e-test:
    name: E2E Test
    strategy:
      matrix:
        node: ['20', '22', '24']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8
      - run: emcc --version
      - run: sudo apt install -y autoconf automake libtool
      - run: ./build-rnnoise.sh

      # [注意] setup-emsdkが古いnode/npmをインストールしてしまうので、
      #        setup-nodeはその後に呼び出す必要がある。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: node --version
      - run: pnpm --version
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e-test

  slack_notify:
    name: Slack Notification
    needs: [e2e-test]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: media-processors
          slack_title: Failure e2e-test
          slack_icon_emoji_failure: ":japanese_ogre:"
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
