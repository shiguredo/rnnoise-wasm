name: e2e-test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  e2e-test:
    name: E2E Test
    strategy:
      matrix:
        node: ['20', '22', '24']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8
      - run: emcc --version
      - run: sudo apt install -y autoconf automake libtool
      - run: ./build-rnnoise.sh

      # [注意] setup-emsdkが古いnode/npmをインストールしてしまうので、
      #        setup-nodeはその後に呼び出す必要がある。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: node --version
      - run: pnpm --version
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e-test

  slack_notify_failed:
    name: Slack Notification
    needs: [e2e-test]
    runs-on: ubuntu-24.04
    if: failure()
    steps:
      - uses: actions/checkout@v5
      - uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: media-processors
          SLACK_COLOR: danger
          SLACK_ICON_EMOJI: ":japanese_ogre:"
          SLACK_TITLE: Failure e2e-test
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}