name: build

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-assets:
    name: Build WASM and JS files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8
      - run: emcc --version
      - run: sudo apt install -y autoconf automake
      - run: ./build-rnnoise.sh

      # [注意] setup-emsdkが古いnode/npmをインストールしてしまうので、
      #        setup-nodeはその後に呼び出す必要がある。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: node --version
      - run: pnpm --version
      - run: pnpm install
      - run: pnpm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rnnoise-wasm-dist
          path: dist/

  create-release:
    name: Upload WASM and JS files
    runs-on: ubuntu-24.04
    needs: [build-assets]
    steps:
      - uses: actions/checkout@v5
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: rnnoise-wasm-dist
          path: dist/
      - name: Release (Canary)
        if: contains(github.ref, 'canary')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/rnnoise_wasm.d.ts \
            dist/rnnoise.d.ts \
            dist/rnnoise.js \
            --prerelease \
            --title "${{ github.ref_name }}"
      - name: Release
        if: ${{ !contains(github.ref, 'canary') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/rnnoise_wasm.d.ts \
            dist/rnnoise.d.ts \
            dist/rnnoise.js \
            --title "${{ github.ref_name }}"

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    needs: [create-release]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: rnnoise-wasm-dist
          path: dist/

      # pnpm publish は CI では正常に動作しない
      # https://github.com/pnpm/pnpm/issues/4937
      - run: npm publish --provenance --no-git-checks
        if: ${{ !contains(github.ref, 'canary') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 

      - run: npm publish --provenance --no-git-checks --tag canary
        if: ${{ contains(github.ref, 'canary') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 

  slack_notify:
    name: Slack Notification
    needs: [npm-publish]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: media-processors
          slack_title: Failure e2e-test
          slack_icon_emoji_failure: ":japanese_ogre:"
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
