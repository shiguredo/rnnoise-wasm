<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RNNoise-Wasm DevTools</title>
</head>

<body>
  <h1>RNNoise-Wasm DevTools</h1>
  <div style="display: flex; gap: 10px;">
    <div>
      <h2>Original Noise</h2>
      <canvas id="original-waveform" width="400" height="100" style="border: 1px solid black;"></canvas>
    </div>
    <div>
      <h2>Processed / Output</h2>
      <canvas id="processed-waveform" width="400" height="100" style="border: 1px solid black;"></canvas>
    </div>
  </div>

  <!-- Simplified Controls -->
  <div style="margin-top: 10px;">
    <button id="toggleGenerateButton" disabled>Start Generating</button>
    <button id="toggleDenoiseButton" disabled>Enable Denoise</button> <!-- Disabled until generation starts -->
    <button id="togglePlaybackButton" disabled>Start Playback</button> <!-- Disabled until generation starts -->
  </div>

  <div class="control-item">
    <label for="noiseScaleSlider">Noise Scale:</label>
    <input type="range" id="noiseScaleSlider" min="0" max="1" step="0.01" value="0.2" />
    <span id="noiseScaleValue">0.20</span>
  </div>
  <div class="control-item">
    <label for="noiseAlphaSlider">Noise Smoothing (Alpha):</label>
    <input type="range" id="noiseAlphaSlider" min="0.01" max="0.99" step="0.01" value="0.1" />
    <span id="noiseAlphaValue">0.10</span>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
